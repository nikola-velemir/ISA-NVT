    <div class="mx-auto w-full max-w-2xl p-4">
      <!-- Tabs -->
      <div role="tablist" class="flex border-b border-gray-200">
        @for (tab of tabs; track tab.id) {
          <button
            type="button"
            role="tab"
            [attr.aria-selected]="active() === tab.id"
            (click)="active.set(tab.id)"
            class="-mb-px flex-1 border-b-2 px-4 py-3 text-sm font-bold tracking-wide transition-colors focus:outline-none focus-visible:bg-gray-100"
            [class]="tabClasses(tab.id)"
          >
            {{ tab.label }}
          </button>
        }
      </div>
 
      <!-- Panel -->
      <div role="tabpanel" class="space-y-5 pt-6">
        <label
          for="file-upload"
          (dragover)="onDragOver($event)"
          (dragleave)="dragging.set(false)"
          (drop)="onDrop($event)"
          class="flex cursor-pointer flex-col items-center justify-center rounded-xl border-2 border-dashed px-6 py-10 text-center transition-colors"
          [class]="
            dragging()
              ? 'border-gray-900 bg-gray-100'
              : 'border-gray-300 bg-gray-50 hover:border-gray-500 hover:bg-gray-100'
          "
        >
          <svg
            class="mb-3 h-8 w-8 text-gray-500"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 7.5L12 3m0 0L7.5 7.5M12 3v13.5"
            />
          </svg>
          <span class="text-sm font-medium text-gray-800">
            {{ current() ? 'Replace image' : 'Click to upload or drag an image here' }}
          </span>
          <span class="mt-1 text-xs text-gray-500">PNG, JPG, GIF, WebP</span>
          <input
            id="file-upload"
            type="file"
            accept="image/*"
            class="sr-only"
            (change)="onFileSelected($event)"
          />
        </label>
 
        @if (currentError()) {
          <p role="alert" class="text-sm text-red-600">{{ currentError() }}</p>
        }
 
        <div class="flex gap-3">
          <button
          (click)="download()"
            type="button"
           
            class="rounded-lg bg-gray-900 px-4 py-2 text-sm font-semibold text-white transition hover:bg-gray-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-gray-900 focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:bg-gray-300"
          >
            Download image
          </button>
          @if (current()) {
            <button
              type="button"
              (click)="clear()"
              class="rounded-lg border border-gray-300 px-4 py-2 text-sm font-medium text-gray-700 transition hover:bg-gray-100 focus:outline-none focus-visible:ring-2 focus-visible:ring-gray-900 focus-visible:ring-offset-2"
            >
              Remove
            </button>
          }
        </div>
 
        @if (current(); as upload) {
          <figure class="overflow-hidden rounded-xl border border-gray-200 bg-white">
            <img
              [src]="upload.url"
              [alt]="upload.name"
              class="max-h-[28rem] w-full object-contain"
            />
            <figcaption class="border-t border-gray-200 px-4 py-2 text-xs text-gray-500">
              {{ upload.name }}
            </figcaption>
          </figure>
        } @else {
          <p class="text-sm text-gray-500">
            Your image will appear here once you upload it.
          </p>
        }
      </div>
    </div>
